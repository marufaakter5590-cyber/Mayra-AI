<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mayra AI</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 0 auto;
      padding: 30px 20px;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
    }

    #chat {
      background: white;
      padding: 20px;
      border-radius: 15px;
      min-height: 250px;
      margin-bottom: 15px;
    }

    input {
      width: 65%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      padding: 12px 15px;
      margin-left: 5px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #send {
      background: #222;
      color: white;
    }

    #voice {
      background: #ddd;
    }

    #reply {
      margin-top: 20px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <h1>🤖 Mayra AI</h1>

  <div id="chat">
    <div id="reply">হ্যালো বস! 👑 আমাকে কিছু বলুন।</div>
  </div>

  <input id="message" type="text" placeholder="মায়রাকে কিছু বলুন...">

  <button id="send" onclick="sendMessage()">Send</button>
  <button id="voice" onclick="startVoice()">🎤 Voice</button>

  <script>
    const messageInput = document.getElementById("message");
    const replyBox = document.getElementById("reply");

    async function sendMessage() {
      const message = messageInput.value.trim();

      if (!message) return;

      replyBox.innerText = "মায়রা ভাবছে...";

      try {
        const response = await fetch(
          "https://mayra-ai.onrender.com/chat",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              message: message
            })
          }
        );

        const data = await response.json();

        replyBox.innerText = data.reply;

        speak(data.reply);

      } catch (error) {
        replyBox.innerText = "দুঃখিত বস, এখন সমস্যা হচ্ছে।";
      }

      messageInput.value = "";
    }

    function startVoice() {
      const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        alert("এই ব্রাউজারে Voice Recognition সাপোর্ট নেই।");
        return;
      }

      const recognition = new SpeechRecognition();

      recognition.lang = "bn-BD";
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.start();

      recognition.onresult = function(event) {
        const text = event.results[0][0].transcript;

        messageInput.value = text;
        sendMessage();
      };

      recognition.onerror = function() {
        alert("বস, Voice নেওয়া যায়নি। আবার চেষ্টা করুন।");
      };
    }

    function speak(text) {
      if (!("speechSynthesis" in window)) return;

      const speech = new SpeechSynthesisUtterance(text);

      speech.lang = "bn-BD";
      speech.rate = 1;
      speech.pitch = 1;

      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(speech);
    }

    messageInput.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
  </script>

</body>
</html>
