<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mayra AI</title>
</head>
<body>
  <h1>🤖 Mayra AI</h1>

  <input id="message" type="text" placeholder="মায়রাকে কিছু বলো...">
  <button onclick="sendMessage()">Send</button>

  <p id="reply"></p>

  <script>
    async function sendMessage() {
      const message = document.getElementById("message").value;
      const reply = document.getElementById("reply");

      reply.innerText = "মায়রা ভাবছে...";

      try {
        const response = await fetch("https://mayra-ai.onrender.com/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: message
          })
        });

        const data = await response.json();
        reply.innerText = data.reply;
      } catch (error) {
        reply.innerText = "সমস্যা হয়েছে। আবার চেষ্টা করো।";
      }
    }
  </script>
</body>
</html>
